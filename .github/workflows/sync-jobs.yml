name: Sync Remote Jobs (Every 3 Hours)

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger RemoteCut Job Ingestion Cron
        env:
          CRON_SECRET: ${{ secrets.REMOTECUT_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error -X POST https://remote.oddpig.io.vn/api/cron/jobs \
            -H "Authorization: Bearer $CRON_SECRET"
