services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: remotecut
      POSTGRES_PASSWORD: remotecut
      POSTGRES_DB: remotecut
    ports:
      - "5432:5432"
    volumes:
      - remotecut_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remotecut"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  remotecut_data:
